<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario de Estudio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <h1>Diario de Estudio</h1>

    <section class="racha" aria-label="Racha actual">
      <p class="racha-numero"><span id="racha">0</span> 🔥</p>
      <p class="racha-texto" id="racha-texto">días seguidos</p>
      <p class="racha-mejor">Mejor racha: <strong id="mejor-racha">0</strong></p>
    </section>

    <section class="tarjeta">
      <h2>Nueva sesión</h2>

      <form id="form-sesion">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" required>

        <label for="tema">Tema</label>
        <input type="text" id="tema" placeholder="Ej.: Matemáticas" required>

        <label for="minutos">Minutos</label>
        <input type="number" id="minutos" min="1" step="1" placeholder="Ej.: 45" required>

        <p class="error" id="error" role="alert" hidden></p>

        <button type="submit">Añadir sesión</button>
      </form>
    </section>

    <section class="tarjeta">
      <h2>Sesiones</h2>
      <p class="vacio" id="vacio">Todavía no hay sesiones. ¡Añade la primera!</p>
      <ul class="lista" id="lista-sesiones"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
